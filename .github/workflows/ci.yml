name: ci

# Pull requests and main run `make verify`, the same command as a local run, with no cloud
# access at all: no id-token permission, no secrets, no role to assume. Shared checks come
# from reusable workflows in gamaware/.github. Starters are graded (they must fail), not
# scanned (ADR 0003).
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HADOLINT_VERSION: "2.15.1"
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      # aws-cdk-lib runs on Node.js through jsii.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - name: Install hadolint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/bin/hadolint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/hadolint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.61.0

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Lint, grade every lab, check the docs, scan the solutions
        run: make verify

  lint-docs:
    name: lint-docs
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/lint-docs.yml@1e2fe2d99f7772ad59b896f332557457ebcbdde9

  lint-actions:
    name: lint-actions
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/lint-actions.yml@1e2fe2d99f7772ad59b896f332557457ebcbdde9

  secrets:
    name: secrets
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/secrets.yml@1e2fe2d99f7772ad59b896f332557457ebcbdde9

  security:
    name: security
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/security.yml@1e2fe2d99f7772ad59b896f332557457ebcbdde9
    with:
      checkov-config: .checkov.yaml
      trivy-skip-dirs: labs/*/starter

  terraform:
    name: terraform
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/terraform.yml@1e2fe2d99f7772ad59b896f332557457ebcbdde9
    with:
      working-directories: >-
        ["labs/01-terraform-remote-state/solution/bootstrap",
        "labs/01-terraform-remote-state/solution/app",
        "labs/02-terraform-module-testing/solution/modules/queue",
        "labs/02-terraform-module-testing/solution/examples/basic"]
      terraform-version: 1.14.5
      tflint-version: v0.61.0

  container:
    name: container
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/container.yml@1e2fe2d99f7772ad59b896f332557457ebcbdde9
    with:
      context: labs/05-containers-to-ecs/solution
      dockerfile: labs/05-containers-to-ecs/solution/Dockerfile
      image-name: harbor-catalog
